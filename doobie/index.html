<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doobie</title>

  <link rel="icon" type="image/png" href="Doobie.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container img {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* fills screen, may crop edges */
      display: block;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="Doobie.gif" alt="Doobie" />
  </div>
</body>
</html>
